# URL de conexão: substitua "seu_banco_de_dados" pelo nome do schema criado no MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/projeto?useSSL=false&serverTimezone=UTC

# Credenciais de acesso ao MySQL
spring.datasource.username=root
spring.datasource.password=

# Driver de Conexão
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
# "update" atualiza o banco automaticamente com base nas suas classes Java @Entity
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL geradas no console (útil para desenvolvimento)
spring.jpa.show-sql=true
